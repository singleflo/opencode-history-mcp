[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-history-mcp"
version = "0.2.0"
description = "MCP server for searching your local OpenCode conversation history"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Roberto Crotti", email = "crotti.roberto@gmail.com" },
]
keywords = ["mcp", "opencode", "model-context-protocol", "search", "history", "fts5", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/singleflo/opencode-history-mcp"
Repository = "https://github.com/singleflo/opencode-history-mcp"
Issues = "https://github.com/singleflo/opencode-history-mcp/issues"

[project.scripts]
opencode-history-mcp = "opencode_history_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_history_mcp"]
